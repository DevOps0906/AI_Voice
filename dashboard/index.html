<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>음성 AI 전문가 과정 학습 대시보드</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --page:#f6f8fa;--panel:#ffffff;--ink:#1f2328;--muted:#59636e;--line:#d0d7de;--soft:#eaeef2;--input:#818b98;--primary:#0969da;--primary-fg:#ffffff;
  --a1:#1b7c83;--a2:#9a6700;--a3:#bf3989;--a4:#8250df;--a5:#0969da;--ok:#1a7f37;--bad:#d1242f;
  --scope:#0d1117;--scope-fg:#f0f6fc;
  --font-sans:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;--font-mono:ui-monospace,"SF Mono",Consolas,monospace;
  --radius:6px;--shadow-pop:0 8px 24px rgb(140 149 159 / .2);--ring:0 0 0 2px rgb(9 105 218 / .4);
  /* 3구간 타입 토큰: 데스크톱 1200~ */
  --fs:16px;--h2:2.05rem;--rail:248px;--roadcols:6;--tap:40px;
  box-sizing:border-box;
}
@media (max-width:1199px){:root{--fs:15px;--h2:1.75rem;--rail:212px;--roadcols:3}}
@media (max-width:767px){:root{--fs:14.5px;--h2:1.45rem;--roadcols:2;--tap:44px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d1117;--panel:#151b23;--ink:#f0f6fc;--muted:#9198a1;--line:#3d444d;--soft:#212830;--input:#727b87;--primary:#4493f8;--primary-fg:#0d1117;
  --a1:#39c5cf;--a2:#d29922;--a3:#db61a2;--a4:#ab7df8;--a5:#4493f8;--ok:#3fb950;--bad:#f85149;--shadow-pop:0 8px 24px rgb(1 4 9 / .6);--ring:0 0 0 2px rgb(68 147 248 / .5);}}
:root[data-theme="dark"]{
  --page:#0d1117;--panel:#151b23;--ink:#f0f6fc;--muted:#9198a1;--line:#3d444d;--soft:#212830;--input:#727b87;--primary:#4493f8;--primary-fg:#0d1117;
  --a1:#39c5cf;--a2:#d29922;--a3:#db61a2;--a4:#ab7df8;--a5:#4493f8;--ok:#3fb950;--bad:#f85149;--shadow-pop:0 8px 24px rgb(1 4 9 / .6);--ring:0 0 0 2px rgb(68 147 248 / .5);}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-sans);font-size:var(--fs);line-height:1.6;overflow-x:hidden;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
a{color:var(--primary)}
code{font-family:var(--font-mono);font-size:.92em;background:var(--soft);padding:1px 5px;border-radius:6px;overflow-wrap:anywhere}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
/* 왼쪽 정거장 목록 */
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:26px 14px 18px 20px;display:flex;flex-direction:column;gap:16px;border-right:1px solid var(--line);min-width:0}
.rail h1{font-size:1.5rem;font-weight:700;line-height:1.15;letter-spacing:-.03em;margin:0}
.rail h1 a.home{color:inherit;text-decoration:none;border-radius:var(--radius)}.rail h1 a.home:hover{color:var(--a5)}.rail h1 a.home:focus-visible{outline:2px solid var(--a5);outline-offset:2px}
.rail h1 small{display:block;font-size:.84rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-bottom:6px}
.daysel{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.daysel select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-height:var(--tap);width:100%}
nav.tabs{display:flex;flex-direction:column;gap:2px;position:relative;min-height:0;overflow-y:auto}
nav.tabs button{position:relative;display:grid;grid-template-columns:24px 1fr;align-items:center;gap:8px;border:0;background:transparent;text-align:left;padding:5px 8px 5px 12px;min-height:36px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:.95rem}
nav.tabs button .tc{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:.78rem;font-variant-numeric:tabular-nums}
nav.tabs button:hover{color:var(--ink);background:var(--soft)}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;background:var(--soft)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--primary)}
nav.tabs button.seen .tc{border-color:var(--a1)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:.82rem;color:var(--muted)}
.railfoot button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;min-height:var(--tap);cursor:pointer;font-size:.85rem;text-align:left}
main{padding:30px clamp(16px,3vw,40px) 60px;max-width:1120px;width:100%;min-width:0}
section.panel{display:none;min-width:0}
section.panel.active{display:block}
h2{font-size:var(--h2);font-weight:700;letter-spacing:-.03em;line-height:1.2;margin:0 0 8px;overflow-wrap:anywhere}
h3{overflow-wrap:anywhere}
.eyebrow{font-size:.84rem;font-weight:700;color:var(--primary);margin-bottom:4px}
.lead{color:var(--muted);margin:0 0 18px;max-width:68ch;overflow-wrap:anywhere}
.msg{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--a2);border-radius:6px;padding:14px 16px}
.note{font-size:.86rem;color:var(--muted);margin:10px 2px 0}
.note.warn{color:var(--a2);font-weight:700}
/* 측정 화면: 테마와 상관없이 늘 어두운 계측기 화면 */
.scope{position:relative;background:var(--scope);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.scope canvas{display:block;width:100%;touch-action:none}
.scope .tag{position:absolute;left:14px;top:10px;color:#9198a1;font-size:.78rem;pointer-events:none;max-width:calc(100% - 28px)}
.cap{min-height:1.7em;margin:10px 2px 0;font-weight:700;color:var(--primary);font-size:1rem;overflow-wrap:anywhere}
.cap:empty::before{content:"\00a0"}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 15px;min-height:var(--tap);border-radius:6px;cursor:pointer;font-size:.92rem;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:700}
.btn.tour{border-color:var(--primary);color:var(--primary);font-weight:700}
.btn.tour[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.chip{border:2px solid var(--c,var(--a4));background:transparent;padding:6px 13px;min-height:var(--tap);border-radius:999px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--c,var(--a4));color:#fff;font-weight:700}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0d1117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1117}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 13px;min-width:0}
.kv span{display:block;font-size:.8rem;color:var(--muted)}
.kv b{font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
/* 로드맵 */
.road{display:grid;grid-template-columns:repeat(var(--roadcols),minmax(0,1fr));gap:8px;margin-top:16px}
.road button{text-align:left;border:0;border-top:4px solid var(--c);background:var(--panel);border-radius:0 0 6px 12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:78px;min-width:0}
.road button b{color:var(--c);font-size:.82rem}
.road button span{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.road button[aria-pressed="true"]{background:var(--c);color:#fff}
.road button[aria-pressed="true"] b{color:#fff}
:root[data-theme="dark"] .road button[aria-pressed="true"],:root[data-theme="dark"] .road button[aria-pressed="true"] b{color:#0d1117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .road button[aria-pressed="true"],:root:not([data-theme="light"]) .road button[aria-pressed="true"] b{color:#0d1117}}
.box,.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.roaddetail{margin-top:10px}
.roaddetail h3{margin:0 0 6px;font-size:1.1rem}
.roaddetail ul{margin:0 0 8px;padding-left:20px;color:var(--muted)}
.roaddetail p{margin:0 0 8px;font-weight:700}
/* 지도 */
.week{margin:0 0 22px}
.week h3{margin:0 0 8px;font-size:1rem;display:flex;gap:8px;align-items:baseline}
.week h3 small{color:var(--muted);font-weight:500}
.stations{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;position:relative}
@media (max-width:1199px){.stations{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:767px){.stations{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{display:flex;flex-direction:column;gap:2px;min-width:0;min-height:var(--tap);border:1px solid var(--line);border-top:4px solid var(--c);background:var(--panel);border-radius:0 0 6px 12px;padding:9px 11px;text-decoration:none;color:var(--ink)}
.st b{color:var(--c);font-size:.82rem}
.st span{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.st em{font-style:normal;font-size:.78rem;color:var(--muted)}
a.st:hover{border-color:var(--ink);border-top-color:var(--c)}
.st.soon{opacity:.55;border-style:dashed;border-top-style:solid}
.st.cur{box-shadow:inset 2px 0 0 var(--primary)}
/* 목표 · 교시 */
ol.goals{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:8px;counter-reset:g}
ol.goals li{counter-increment:g;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;animation:gIn .5s ease both;animation-delay:calc(var(--i)*110ms)}
ol.goals li::before{content:counter(g);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--page);font-weight:700;font-size:.82rem}
@keyframes gIn{from{opacity:0;transform:translateX(-14px)}}
.periods{display:flex;gap:4px;margin:0 0 10px}
.periods div{flex:1;min-width:0;height:14px;background:var(--c);border-radius:4px;transform-origin:left;animation:pIn .6s ease both;animation-delay:calc(var(--i)*140ms)}
@keyframes pIn{from{transform:scaleX(0)}}
.plist{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:1199px){.plist{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){.plist{grid-template-columns:minmax(0,1fr)}}
.plist .card{border-top:4px solid var(--c);border-radius:0 0 6px 12px}
.plist b{color:var(--c);font-size:.84rem}
.plist p{margin:2px 0 6px;font-weight:700;overflow-wrap:anywhere}
.plist small{color:var(--muted);overflow-wrap:anywhere}
h3.sec{margin:26px 0 10px;font-size:1.05rem}
.parts{display:flex;flex-wrap:wrap;gap:6px;padding:0;margin:0;list-style:none}
.parts li{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem;overflow-wrap:anywhere}
.parts li b{color:var(--a4);margin-right:4px}
/* 애니메이션 */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.acards button{text-align:left;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--panel);border-radius:0 0 6px 12px;padding:9px 11px;min-height:var(--tap);cursor:pointer;min-width:0;display:flex;flex-direction:column}
.acards button b{color:var(--c);font-size:.78rem}
.acards button span{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.acards button small{color:var(--muted);overflow-wrap:anywhere}
.acards button[aria-pressed="true"]{background:var(--c);color:#fff}
.acards button[aria-pressed="true"] b,.acards button[aria-pressed="true"] small{color:inherit}
:root[data-theme="dark"] .acards button[aria-pressed="true"]{color:#0d1117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .acards button[aria-pressed="true"]{color:#0d1117}}
.afrm{display:block;width:100%;height:clamp(520px,78vh,820px);border:1px solid var(--line);border-radius:6px;background:var(--panel)}
/* 파일 */
.flist{display:grid;gap:8px}
.frow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.frow .k{font-weight:700;font-size:.82rem;color:var(--a4);text-transform:uppercase}
.frow .n{min-width:0;overflow-wrap:anywhere}
.frow .n small{display:block;color:var(--muted)}
.frow .lk{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.frow .lk a,.badge{display:inline-flex;align-items:center;min-height:var(--tap);padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:.86rem;text-decoration:none;color:var(--ink);font-weight:700}
.frow .lk a:hover{border-color:var(--ink)}
.frow.miss{border-style:dashed;opacity:.7}
.badge{color:var(--muted);font-weight:500;border-style:dashed}
@media (max-width:767px){.frow{grid-template-columns:minmax(0,1fr)}.frow .lk{justify-content:flex-start}}
/* 표 */
.tw{overflow-x:auto;max-width:100%}
table.lt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
table.lt th,table.lt td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
table.lt th{background:var(--soft);font-size:.84rem;color:var(--muted)}
table.lt td:first-child{font-weight:700;width:22%}
@media (max-width:767px){
  table.lt thead{display:none}
  table.lt,table.lt tbody,table.lt tr,table.lt td{display:block;width:100%}
  table.lt tr{border-bottom:1px solid var(--line);padding:6px 0}
  table.lt td{border:0;padding:3px 12px}
  table.lt td:first-child{width:100%}
  table.lt td[data-l]::before{content:attr(data-l) " · ";color:var(--muted);font-size:.8rem}
}
/* 과제 */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:700}
.bar .track{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;width:0;background:var(--a1);border-radius:99px;transition:width .35s}
.hw{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.hw label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;min-height:var(--tap);overflow-wrap:anywhere}
.hw input{width:22px;height:22px;accent-color:var(--a1);margin:2px 0 0}
.hw label.done{border-color:var(--ok)}
.hw label.done span{color:var(--muted);text-decoration:line-through}
/* 퀴즈 */
.qchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.scen{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;min-width:0}
.scen .q{font-weight:700;margin-bottom:8px;overflow-wrap:anywhere}
.scen .q .qn{display:inline-block;min-width:1.8em;color:var(--a4)}
.scen .opts{display:grid;gap:6px}
.scen .opts button,.scen .opts label{text-align:left;border:1px solid var(--line);background:transparent;border-radius:6px;padding:9px 12px;min-height:var(--tap);cursor:pointer;transition:transform .12s;overflow-wrap:anywhere;display:block}
.scen .opts label{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start}
.scen .opts input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--a4)}
.scen .opts button:hover:not(:disabled),.scen .opts label:hover{border-color:var(--ink)}
.scen .opts button:disabled{color:inherit;cursor:default}
.scen .opts .right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent);font-weight:700}
.scen .opts .wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.scen .opts button.picked{border-color:var(--a4);background:color-mix(in srgb,var(--a4) 14%,transparent)}
.scen .opts button .pn{display:inline-block;min-width:1.6em;font-weight:700;color:var(--a4)}
.scen.shk{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px;align-items:center;border:1px solid transparent;border-radius:6px;padding:2px}
.mrow span{overflow-wrap:anywhere}
.mrow select,.numin{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 8px;min-height:var(--tap);min-width:0;width:100%}
.mrow.right{border-color:var(--ok)}.mrow.wrong{border-color:var(--bad)}
@media (max-width:767px){.mrow{grid-template-columns:minmax(0,1fr)}}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow .numin{width:140px}
.scen .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.scen .hint{font-size:.86rem;color:var(--muted);margin-top:6px}
.scen .fb{display:none;margin-top:8px;color:var(--muted);font-size:.92rem;border-left:3px solid var(--a1);padding-left:10px;overflow-wrap:anywhere}
.scen.done .fb{display:block}
.scen.done.bad .fb{border-color:var(--bad)}
.scen .fb b{color:var(--ok)}.scen.bad .fb b{color:var(--bad)}
/* 모션 레퍼런스 */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:1199px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.mc h4{margin:0;font-size:.98rem;overflow-wrap:anywhere}
.mc h4 code{margin-left:4px;font-weight:400}
.mc p{margin:0;color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
.stg{min-height:96px;border-radius:6px;background:var(--page);border:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;overflow:hidden}
.stg .box{padding:8px 14px;font-weight:700}
.stg .pill{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--a4);color:#fff;font-weight:700}
:root[data-theme="dark"] .stg .pill{color:#0d1117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stg .pill{color:#0d1117}}
.stg canvas{width:100%;display:block;background:var(--scope);border-radius:6px}
.mc pre{margin:0;background:var(--soft);border-radius:6px;padding:8px 10px;font-size:.78rem;overflow-x:auto;max-width:100%;max-height:170px;white-space:pre}
.mc details summary{cursor:pointer;font-size:.86rem;font-weight:700;min-height:var(--tap);display:flex;align-items:center}
footer{margin-top:36px;color:var(--muted);font-size:.84rem}
/* 모바일: 레일 → 상단 가로 탭 */
@media (max-width:767px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px 8px;gap:10px}
  .rail h1{font-size:1.2rem}
  .rail h1 small{display:inline;margin:0 8px 0 0}
  .rail .daysel{grid-template-columns:auto minmax(0,1fr);align-items:center}
  nav.tabs{flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:4px;padding-bottom:6px;max-width:100%}
  nav.tabs::before{display:none}
  nav.tabs button{flex:0 0 auto;grid-template-columns:24px auto;gap:6px;padding:4px 10px;font-size:.88rem;white-space:nowrap;min-height:var(--tap)}
  nav.tabs button .tc{width:24px;height:24px}
  nav.tabs button[aria-selected="true"]::before{left:8px;right:8px;top:auto;bottom:0;width:auto;height:2px}

  const d=DATA[S.day],gs=(d.worksheet&&d.worksheet.groups)||[],res={};let gcur=0;
  const total=gs.reduce((a,g)=>a+g.qs.length,0);
  $('p-quiz').innerHTML=head('S7','정리 퀴즈',d.title)+`<div class="bar"><span id="qN"></span><div class="track"><i id="qB"></i></div></div><div class="qchips" id="qChips"></div><div id="qBody"></div>
  <p class="note">문제는 원본 워크시트(${esc((d.worksheet&&d.worksheet.source)||'')})에서 가져왔어요. 푼 기록은 저장되지 않아요.</p>`;
  const upd=()=>{const ans=Object.keys(res).length,ok=Object.values(res).filter(Boolean).length;$('qN').textContent=`${ans} / ${total} 풀이 · 정답 ${ok}`;$('qB').style.width=(total?ans/total*100:0)+'%';
    $('qChips').querySelectorAll('[data-g]').forEach((b,i)=>{const n=Object.keys(res).filter(k=>k.startsWith(i+'-')).length;b.textContent=`${gs[i].title} (${n}/${gs[i].qs.length})`;});};
  const fin=(card,id,q,ok,extra)=>{res[id]=ok;card.classList.add('done',ok?'ok':'bad');
    if(!ok){card.classList.add('shk');setTimeout(()=>card.classList.remove('shk'),400);}
    card.querySelector('.fb').innerHTML=`<b>${ok?'정답':'오답'}</b> ${extra||''}${esc(q.w||'')}`;
    card.querySelectorAll('button,select,input').forEach(x=>x.disabled=true);upd();};
  function build(q,gi,qi){
    const id=gi+'-'+qi,card=mk('div','scen');
    card.innerHTML=`<div class="q"><span class="qn">${qi+1}.</span>${esc(q.p)}</div><div class="body"></div><div class="fb" aria-live="polite"></div>`;
    const body=card.querySelector('.body');
    if(q.ty==='mc'||q.ty==='ox'){
      const o=q.ty==='ox'?['O 맞다','X 틀리다']:q.o,right=q.ty==='ox'?(q.a?0:1):q.a;
      body.className='opts';body.innerHTML=o.map((t,i)=>`<button type="button" data-i="${i}">${esc(t)}</button>`).join('');
      body.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===right;
        body.children[right].classList.add('right');if(!ok)b.classList.add('wrong');fin(card,id,q,ok);});
    }else if(q.ty==='multi'){
      body.className='opts';body.innerHTML=q.o.map((t,i)=>`<label><input type="checkbox" data-i="${i}"><span>${esc(t)}</span></label>`).join('')+`<div class="acts"><button type="button" class="btn go">확인</button></div>`;
      body.querySelector('.btn').onclick=()=>{const sel=[...body.querySelectorAll('input')].map(x=>x.checked);const ok=sel.every((s,i)=>s===q.a.includes(i));
        const labs=body.querySelectorAll('label');labs.forEach((l,i)=>{if(q.a.includes(i))l.classList.add('right');else if(sel[i])l.classList.add('wrong');});fin(card,id,q,ok);};
    }else if(q.ty==='match'){
      body.innerHTML=q.left.map((l,i)=>`<div class="mrow"><span>${esc(l)}</span><select aria-label="${esc(l)}"><option value="">고르세요</option>${q.right.map((r,j)=>`<option value="${j}">${esc(r)}</option>`).join('')}</select></div>`).join('')+`<div class="acts"><button type="button" class="btn go">확인</button></div><div class="hint" role="status"></div>`;
      body.querySelector('.btn').onclick=()=>{const sels=[...body.querySelectorAll('select')];if(sels.some(s=>s.value==='')){body.querySelector('.hint').textContent='모든 항목을 골라 주세요.';return;}
        let ok=true;sels.forEach((s,i)=>{const r=+s.value===q.a[i];if(!r)ok=false;s.closest('.mrow').classList.add(r?'right':'wrong');});
        fin(card,id,q,ok,ok?'':'정답: '+q.left.map((l,i)=>esc(l)+' → '+esc(q.right[q.a[i]])).join(' / ')+'. ');};
    }else if(q.ty==='order'){
      const disp=seeded(id,q.steps.length,q.a),picks=[];
      body.className='opts';body.innerHTML=disp.map(i=>`<button type="button" data-i="${i}">${esc(q.steps[i])}</button>`).join('')+`<div class="acts"><button type="button" class="btn go" disabled>확인</button><button type="button" class="btn" data-undo>다시 고르기</button></div><div class="hint">차례대로 눌러 순서를 정하세요.</div>`;
      const btns=[...body.querySelectorAll('[data-i]')],go=body.querySelector('.go');
      btns.forEach(b=>b.onclick=()=>{if(picks.includes(+b.dataset.i))return;picks.push(+b.dataset.i);b.classList.add('picked');b.innerHTML=`<span class="pn">${picks.length}</span>`+esc(q.steps[+b.dataset.i]);go.disabled=picks.length<q.steps.length;});
      body.querySelector('[data-undo]').onclick=()=>{picks.length=0;btns.forEach(b=>{b.classList.remove('picked');b.textContent=q.steps[+b.dataset.i];});go.disabled=true;};
      go.onclick=()=>{const ok=picks.join()===q.a.join();fin(card,id,q,ok,ok?'':'정답 순서: '+q.a.map((i,n)=>(n+1)+') '+esc(q.steps[i])).join(' ')+'. ');};
    }else if(q.ty==='num'){
      body.innerHTML=`<div class="numrow"><input class="numin" type="number" step="any" inputmode="decimal" aria-label="답"><span>${esc(q.unit||'')}</span><button type="button" class="btn go">확인</button></div>${q.hint?`<div class="hint">${esc(q.hint)}</div>`:''}`;
      const inp=body.querySelector('input'),chk=()=>{if(inp.value==='')return;const ok=Math.abs(parseFloat(inp.value)-q.a)<1e-6*Math.max(1,Math.abs(q.a));fin(card,id,q,ok,ok?'':'정답: '+q.a+' '+esc(q.unit||'')+'. ');};
      body.querySelector('.btn').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk();};
    }
    return card;}
  function showG(g){gcur=g;const b=$('qBody');b.innerHTML='';
    Object.keys(res).forEach(k=>{if(k.startsWith(g+'-'))delete res[k];});
    gs[g].qs.forEach((q,qi)=>b.appendChild(build(q,g,qi)));
    const r=mk('div','row','<button class="btn" type="button">이 묶음 다시 풀기</button>');r.querySelector('button').onclick=()=>showG(g);b.appendChild(r);
    $('qChips').querySelectorAll('[data-g]').forEach((x,i)=>x.setAttribute('aria-pressed',i===g));upd();}
  $('qChips').innerHTML=gs.map((g,i)=>`<button class="chip" type="button" data-g="${i}" aria-pressed="false">${esc(g.title)}</button>`).join('');
  $('qChips').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{if(+b.dataset.g!==gcur)showG(+b.dataset.g);});
  if(gs.length)showG(0);else $('qBody').innerHTML='<p class="note">이 일차에는 퀴즈가 없어요.</p>';
}
function renderDay(){stopTour();const d=DATA[S.day];renderFlow();renderGoals();renderAnim();renderFiles();renderLearned();renderTasks();renderQuiz();S.rendered=S.day;document.title='D'+d.day+' '+d.title+' · 학습 대시보드';}

/* ── 라우팅 ── */
const hashOf=(tab,day)=>tab==='map'||tab==='motion'?'#'+tab:'#d'+day+'-'+tab;
function nav(tab){const h=hashOf(tab,S.day);if(location.hash===h)route();else location.hash=h;}
function parse(){const h=location.hash.replace(/^#/,'');if(h==='map'||h==='motion')return {tab:h};
  const m=/^d(\d+)-(flow|goals|anim|files|learned|tasks|quiz)$/.exec(h);return m?{tab:m[2],day:+m[1]}:{tab:'map'};}
const tabsEl=$('tabs');
TABS.forEach(([id,label],i)=>{const b=mk('button',null,`<span class="tc">${i+1}</span>${label}`);b.type='button';b.setAttribute('role','tab');b.dataset.t=id;b.setAttribute('aria-selected','false');b.onclick=()=>nav(id);tabsEl.appendChild(b);});
const tabBtns=[...tabsEl.children];
let routing=0;
async function route(){
  const my=++routing,p=parse();let tab=p.tab;
  if(p.day){const c=S.course.find(x=>x.day===p.day);if(!c||!c.ready)tab='map';else S.day=p.day;}
  $('daySel').value=String(S.day);
  try{
    if(DAYTABS.has(tab)){await loadDay(S.day);if(my!==routing)return;if(S.rendered!==S.day)renderDay();}
    else if(tab==='map')renderMap();
    else if(tab==='motion')renderMotion();
  }catch(e){
    $('p-'+tab).innerHTML=DAYTABS.has(tab)?`<div class="msg" role="status">D${S.day} 자료는 아직 준비 중이에요. <a href="#map">과정 지도로 돌아가기</a></div>`:`<div class="msg" role="alert">데이터를 불러오지 못했어요. 저장소 맨 위에서 <code>python -m http.server</code>를 실행한 뒤 <code>/dashboard/index.html</code>로 여세요.</div>`;
  }
  if(my!==routing)return;
  if(tab!==active)stopTour();
  active=tab;S.tab=tab;
  tabBtns.forEach(b=>{const on=b.dataset.t===tab;b.setAttribute('aria-selected',on);if(on)b.classList.add('seen');});
  document.querySelectorAll('section.panel').forEach(s=>s.classList.toggle('active',s.id==='p-'+tab));
  if(tab==='anim')syncAnim();
  if(tab==='flow'){FL.last=-2;}
  kick();
}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;
  const i=tabBtns.findIndex(b=>b.dataset.t===active);
  if(e.key==='ArrowRight'&&i<tabBtns.length-1)nav(tabBtns[i+1].dataset.t);
  if(e.key==='ArrowLeft'&&i>0)nav(tabBtns[i-1].dataset.t);});
$('daySel').onchange=e=>{S.day=+e.target.value;S.anim=null;nav(DAYTABS.has(active)?active:(active==='motion'?'motion':'flow'));};
/* 테마 */
const sv=sget('aiVoiceDash.theme');if(sv==='dark'||sv==='light')document.documentElement.dataset.theme=sv;
$('themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';sset('aiVoiceDash.theme',r.dataset.theme);};
/* 시작 */
(async()=>{
  try{S.course=await jget('../data/course.json');}catch(e){S.course=[];
    $('p-map').innerHTML=`<div class="msg" role="alert">과정 데이터를 불러오지 못했어요. 저장소 맨 위에서 <code>python -m http.server</code>를 실행한 뒤 <code>/dashboard/index.html</code>로 여세요.</div>`;
    $('p-map').classList.add('active');return;}
  $('daySel').innerHTML=S.course.map(c=>`<option value="${c.day}"${c.ready?'':' disabled'}>D${c.day} · ${esc(c.title)}${c.ready?'':' (준비 중)'}</option>`).join('');
  const first=S.course.find(c=>c.ready);if(first)S.day=first.day;
  await route();requestAnimationFrame(frame);
})();
})();
</script>
